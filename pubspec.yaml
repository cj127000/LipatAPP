name: lipat4ppv1
description: LIPAT - Local Hauling and Moving Service Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  intl: ^0.19.0
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  cloudinary_public: ^0.23.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/hero_courier.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/